<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈 개편 시안 2 — 매장별 섹션 (스크롤하며 전 매장을 훑어봄)</title>
<style>
  :root{
    --yellow:#FFC800; --yellow-dark:#E0AF00; --black:#111111; --white:#ffffff;
    --bg:#F6F6F4; --border:#eceae4; --gray:#8a8a90; --red:#e5484d; --green:#2f9e58;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--black);-webkit-font-smoothing:antialiased;}
  .concept-badge{position:fixed;top:14px;left:14px;background:var(--black);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;z-index:100;letter-spacing:.3px;}
  .concept-sub{position:fixed;top:14px;left:150px;background:#fff;color:#555;font-size:11px;font-weight:600;padding:6px 12px;border-radius:20px;z-index:100;border:1px solid var(--border);}

  #home{max-width:820px;margin:0 auto;padding:60px 24px 100px;}
  .home-head{margin-bottom:8px;}
  .home-head .greet{font-size:13px;color:var(--gray);font-weight:600;}
  .home-head h1{font-size:26px;font-weight:800;margin:6px 0 4px;letter-spacing:-.5px;}
  .home-head p{font-size:13px;color:var(--gray);margin:0;}

  .jump-row{display:flex;gap:6px;overflow-x:auto;margin:20px 0 26px;padding-bottom:6px;position:sticky;top:0;background:rgba(246,246,244,.92);backdrop-filter:blur(10px);padding-top:10px;z-index:5;}
  .jump-chip{flex-shrink:0;border:1.5px solid var(--border);background:var(--white);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;color:#555;cursor:pointer;white-space:nowrap;}
  .jump-chip.warn{border-color:#f6b9bb;color:var(--red);}
  .jump-chip.mine{border-color:var(--yellow-dark);background:#fff8de;color:#5c4600;}

  .store-section{background:var(--white);border-radius:20px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);scroll-margin-top:70px;}
  .store-section.mine{border:1.5px solid var(--yellow-dark);}
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .sec-head h3{font-size:16.5px;font-weight:800;margin:0;letter-spacing:-.3px;}
  .sec-head h3 .mine-tag{font-size:10px;font-weight:800;color:#8a7300;background:#fff3cc;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
  .sec-head .counts{font-size:11.5px;color:var(--gray);font-weight:700;}
  .sec-head .counts b{color:var(--black);}
  .sec-head .counts b.warn{color:var(--red);}
  .enter-link{font-size:12px;font-weight:700;color:#2f6fe5;cursor:pointer;}

  .mini-list{margin-top:10px;}
  .mini-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);}
  .mini-row .mtitle{font-size:13px;font-weight:700;}
  .mini-row .mmeta{font-size:11px;color:var(--gray);margin-top:2px;}
  .mini-pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:#f0f0ee;color:#555;}
  .mini-pill.overdue{background:#fdeaea;color:var(--red);}
  .quiet{padding:14px 0;text-align:center;color:var(--gray);font-size:12.5px;}
</style>
</head>
<body>
<div class="concept-badge">홈 개편 시안 2</div>
<div class="concept-sub">매장별 섹션 — 스크롤 한 번으로 전 매장을 훑어봄, 각 섹션 안에서 바로 처리</div>

<div id="home">
  <div class="home-head">
    <div class="greet">2026년 8월 10일 · 신재현 님</div>
    <h1>매장별 현황</h1>
    <p>매장을 고르지 않아도 아래로 스크롤하면 전 매장이 순서대로 보여요. 위 칩을 누르면 그 매장 섹션으로 바로 이동합니다.</p>
  </div>

  <div class="jump-row" id="jump-row"></div>
  <div id="sections"></div>
</div>

<script>
const STORES = [
  {name:'구월로데오',mine:true},{name:'연수'},{name:'인천공항'},{name:'논현'},{name:'구월길병원'},
  {name:'계산'},{name:'부천상동'},{name:'부천중동'},{name:'을지로'},{name:'검단'}
];
const AS_PRODUCTS = ['그래피티C · 배터리[블랙]','롤리팟-J · 블루','그래피티3 · 핑크','릴렉스 에이스','쥴 브리즈 민트'];
const PR_PRODUCTS = ['RELX 파이 맥스 머스캣','쥴 브리즈 민트','그래피티C 신제품'];
const CUSTOMERS = ['김고객','이고객','박고객','최고객','정고객'];

function seedRandom(seed){ let s = seed; return () => { s = (s*9301+49297)%233280; return s/233280; }; }
const rnd = seedRandom(7);
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }

STORES.forEach(st=>{
  st.asItems = [];
  const asCount = Math.floor(rnd()*5);
  for(let i=0;i<asCount;i++){
    const days = Math.floor(rnd()*8);
    st.asItems.push({title:pick(AS_PRODUCTS), customer:pick(CUSTOMERS), days, overdue: days>=4});
  }
  st.prItems = [];
  const prCount = Math.floor(rnd()*3);
  for(let i=0;i<prCount;i++){
    st.prItems.push({title:pick(PR_PRODUCTS), customer:pick(CUSTOMERS)});
  }
  st.warn = st.asItems.some(i=>i.overdue);
});

function renderJump(){
  document.getElementById('jump-row').innerHTML = STORES.map(s=>
    `<div class="jump-chip ${s.warn?'warn':''} ${s.mine?'mine':''}" onclick="jumpTo('${s.name}')">${s.name}${s.warn?' ●':''}</div>`
  ).join('');
}
function jumpTo(name){
  document.getElementById('sec-'+name).scrollIntoView({behavior:'smooth', block:'start'});
}
function renderSections(){
  document.getElementById('sections').innerHTML = STORES.map(s=>{
    const asRows = s.asItems.slice(0,3).map(i=>`
      <div class="mini-row">
        <div><div class="mtitle">${i.title}</div><div class="mmeta">${i.customer} · AS 접수</div></div>
        <span class="mini-pill ${i.overdue?'overdue':''}">${i.days}일째</span>
      </div>`).join('');
    const prRows = s.prItems.slice(0,2).map(i=>`
      <div class="mini-row">
        <div><div class="mtitle">${i.title}</div><div class="mmeta">${i.customer} · 예약 대기</div></div>
        <span class="mini-pill">대기중</span>
      </div>`).join('');
    const rows = asRows+prRows;
    return `
    <div class="store-section ${s.mine?'mine':''}" id="sec-${s.name}">
      <div class="sec-head">
        <h3>${s.name}${s.mine?'<span class="mine-tag">내 매장</span>':''}</h3>
        <span class="counts">AS <b class="${s.warn?'warn':''}">${s.asItems.length}</b>건 · 예약 <b>${s.prItems.length}</b>건</span>
      </div>
      <div class="mini-list">
        ${rows || '<div class="quiet">처리할 항목이 없습니다</div>'}
      </div>
    </div>`;
  }).join('');
}
renderJump();
renderSections();
</script>
</body>
</html>
